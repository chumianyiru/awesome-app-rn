name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-13
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        working-directory: ios

    - name: Install dependencies
      run: |
        npm install --legacy-peer-deps

    - name: Install CocoaPods dependencies
      working-directory: ios
      run: |
        bundle install
        bundle exec pod install

    - name: Build iOS Release
      working-directory: ios
      run: |
        xcodebuild -workspace AwesomeApp.xcworkspace \
          -scheme AwesomeApp \
          -configuration Release \
          -sdk iphoneos \
          -destination generic/platform=iOS \
          -archivePath $RUNNER_TEMP/AwesomeApp.xcarchive \
          clean archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Create IPA
      working-directory: ios
      run: |
        mkdir -p $RUNNER_TEMP/Payload
        cp -r $RUNNER_TEMP/AwesomeApp.xcarchive/Products/Applications/AwesomeApp.app $RUNNER_TEMP/Payload/
        cd $RUNNER_TEMP
        zip -r AwesomeApp.ipa Payload
        mkdir -p $GITHUB_WORKSPACE/build
        cp AwesomeApp.ipa $GITHUB_WORKSPACE/build/

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: build/*.ipa
